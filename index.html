<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cumpleaños de Marina</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Chewy&family=Poppins:wght@400;500;600;700&family=Roboto+Slab:wght@400;700&family=Sansita+Swashed:wght@400;700;800&family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"

    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="brillos"></div>

    <div class="card-content">
        <h1>Te invito a mi cumple</h1>

        <h2 class="number">23</h2>

        <div class="container">
            <div class="datecont">
                <span class="material-symbols-outlined">calendar_today</span>
                <p class="date">Viernes 28 de Agosto</p>
            </div>

            <span class="separator">|</span>

            <div class="timecont">
                <span class="material-symbols-outlined">schedule</span>
                <p class="time">A partir de las 22hs</p>
            </div>
        </div>

        <div class="placecont">
            <span class="material-symbols-outlined">location_on</span>
            <p class="location">Hipólito Yrigoyen 463</p>
        </div>

        <div class="ubicont">
            <span class="material-symbols-outlined">subdirectory_arrow_right</span>
            <a id="maps" href="https://maps.app.goo.gl/MZ6kiFUkea1BDQsP9" target="_blank" rel="noopener noreferrer">Ver
                en Maps</a>
        </div>

        <h3>¡Te espero!</h3>

        <h2 class="name">Marina</h2>

        <div class="buttonscont">
            <button
                onclick="window.open('https://wa.me/543777472417?text=%C2%A1Hola%20Marina!%20Confirmo%20mi%20asistencia%20a%20tu%20cumplea%C3%B1os', '_blank')">Confirmar
                asistencia</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
